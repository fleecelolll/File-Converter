name: Windows release gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-install-and-repair:
    name: ${{ matrix.runner }} clean install and repair
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2022
          - windows-2025
          - windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PYTHONNOUSERSITE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and fresh-extract the exact release ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'File-Converter-v1.0.15.zip'
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'Fleece File Converter release'
          & .\scripts\Build-ReleaseZip.ps1 -OutputPath $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $releaseRoot
          "RELEASE_ROOT=$releaseRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify early failures and repair instructions before downloads
        if: matrix.runner != 'windows-11-arm'
        shell: pwsh
        run: .\.github\scripts\Test-SetupPreflight.ps1 -ReleaseRoot $env:RELEASE_ROOT -AppName 'File Converter'

      - name: Verify safe ARM64 unsupported-platform handling
        if: matrix.runner == 'windows-11-arm'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location -LiteralPath $env:RELEASE_ROOT
          try {
          $output = & "$env:SystemRoot\System32\cmd.exe" /d /s /c 'call "Installer.bat" --yes --no-pause' 2>&1
          $exitCode = $LASTEXITCODE
          } finally { Pop-Location }
          $output | Write-Host
          $text = $output -join "`n"
          if ($exitCode -ne 1) {
            throw "The x64-only installer returned unexpected exit code $exitCode on ARM64."
          }
          if ($text -notmatch 'This installer currently supports x64 Windows only\.') {
            throw 'The ARM64 rejection did not report the exact supported-platform boundary.'
          }
          foreach ($path in @('.runtime', 'File Converter.lnk', 'setup.log')) {
            if (Test-Path -LiteralPath (Join-Path $env:RELEASE_ROOT $path)) {
              throw "The unsupported-platform check changed local setup state: $path"
            }
          }
          # GitHub's PowerShell wrapper propagates the last native exit code.
          # The installer exit code above is expected and has now been verified.
          $global:LASTEXITCODE = 0

      - name: Perform a clean private setup and app self-test through the confirmation prompt
        if: matrix.runner != 'windows-11-arm'
        shell: cmd
        run: |
          cd /d "%RELEASE_ROOT%"
          echo Y| call Installer.bat --no-pause

      - name: Verify the repair path against the installed runtime
        if: matrix.runner != 'windows-11-arm'
        shell: cmd
        run: |
          cd /d "%RELEASE_ROOT%"
          Installer.bat --yes --no-pause

      - name: Verify the repaired shortcut target and launch contract
        if: matrix.runner != 'windows-11-arm'
        shell: pwsh
        run: .\.github\scripts\Test-Shortcut.ps1 -ReleaseRoot $env:RELEASE_ROOT -AppName 'File Converter'

      - name: Convert a benign image through the released app
        if: matrix.runner != 'windows-11-arm'
        shell: pwsh
        run: |
          & (Join-Path $env:RELEASE_ROOT '.runtime\python\python.exe') -I '.github\scripts\Test-RealConversion.py' $env:RELEASE_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'The real image-conversion workflow failed.' }

      - name: Upload diagnostics if a gate fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: setup-diagnostics-${{ matrix.runner }}-${{ github.run_id }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          path: |
            ${{ runner.temp }}/Fleece File Converter release/setup.log
            ${{ runner.temp }}/Fleece File Converter release/.runtime/error.log
            ${{ runner.temp }}/Fleece File Converter release/.runtime/logs/*.log
