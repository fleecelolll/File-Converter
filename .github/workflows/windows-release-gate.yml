name: Windows release gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-install-and-repair:
    name: ${{ matrix.runner }} clean install and repair
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2022
          - windows-2025
          - windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PYTHONNOUSERSITE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Verify safe ARM64 unsupported-platform handling
        if: matrix.runner == 'windows-11-arm'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = & "$env:SystemRoot\System32\cmd.exe" /d /s /c 'call "Installer.bat" --yes --no-pause --skip-association' 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Host
          $text = $output -join "`n"
          if ($exitCode -ne 1) {
            throw "The x64-only installer returned unexpected exit code $exitCode on ARM64."
          }
          if ($text -notmatch 'This installer currently supports x64 Windows only\.') {
            throw 'The ARM64 rejection did not report the exact supported-platform boundary.'
          }
          foreach ($path in @('.runtime', 'File Converter.lnk', 'setup.log')) {
            if (Test-Path -LiteralPath $path) {
              throw "The unsupported-platform check changed local setup state: $path"
            }
          }
          # GitHub's PowerShell wrapper propagates the last native exit code.
          # The installer exit code above is expected and has now been verified.
          $global:LASTEXITCODE = 0

      - name: Verify the shared launcher without changing associations
        if: matrix.runner != 'windows-11-arm'
        shell: cmd
        run: Installer.bat --test-association

      - name: Perform a clean private setup and app self-test
        if: matrix.runner != 'windows-11-arm'
        shell: cmd
        run: Installer.bat --yes --no-pause --skip-association

      - name: Verify the repair path against the installed runtime
        if: matrix.runner != 'windows-11-arm'
        shell: cmd
        run: Installer.bat --yes --no-pause --skip-association

      - name: Upload diagnostics if a gate fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: setup-diagnostics-${{ matrix.runner }}-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            setup.log
            .runtime/error.log
            .runtime/logs/*.log
